<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hoshino Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f0; color: #1a1a1a; min-height: 100vh; }
    .container { max-width: 860px; margin: 0 auto; padding: 2rem 1rem; }
    .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
    h1 { font-size: 20px; font-weight: 600; }
    h2 { font-size: 16px; font-weight: 600; margin-bottom: 1rem; }
    .card { background: #fff; border: 1px solid #e5e5e0; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .badge { font-size: 12px; padding: 3px 10px; border-radius: 6px; font-weight: 500; }
    .badge-active  { background: #eaf3de; color: #3b6d11; }
    .badge-logout  { background: #fcebeb; color: #a32d2d; }
    .badge-idle    { background: #e6f1fb; color: #185fa5; }
    .agent-name  { font-weight: 600; font-size: 15px; flex: 1; }
    .agent-phone { font-size: 13px; color: #666; margin-top: 4px; }
    hr { border: none; border-top: 1px solid #f0f0ec; margin: 12px 0; }
    .form-row { display: grid; gap: 8px; margin-bottom: 10px; }
    .form-row.col2 { grid-template-columns: 1fr 1fr; }
    .form-row.col3 { grid-template-columns: 1fr 1fr auto; }
    .form-row.col4 { grid-template-columns: 1fr 1fr 1fr auto; }
    input[type=text], select {
      width: 100%; padding: 8px 12px; border: 1px solid #ddd;
      border-radius: 8px; font-size: 14px; outline: none;
      transition: border-color 0.15s; background: #fff;
    }
    input[type=text]:focus, select:focus { border-color: #888; }
    button {
      padding: 8px 14px; border: 1px solid #ccc; border-radius: 8px;
      background: #fff; font-size: 13px; cursor: pointer;
      transition: background 0.15s, border-color 0.15s; white-space: nowrap;
    }
    button:hover { background: #f5f5f0; border-color: #999; }
    button:active { transform: scale(0.98); }
    button.danger { color: #a32d2d; border-color: #f09595; }
    button.danger:hover { background: #fcebeb; }
    button.primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
    button.primary:hover { background: #333; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .qr-wrap { display: none; flex-direction: column; align-items: center; gap: 12px; padding: 1rem 0; }
    .qr-wrap img { width: 180px; height: 180px; border-radius: 8px; border: 1px solid #e5e5e0; }
    .pairing-code { font-size: 32px; font-weight: 700; letter-spacing: 8px; font-family: monospace; color: #1a1a1a; }
    .label { font-size: 13px; color: #666; }
    .log { background: #f5f5f0; border-radius: 8px; padding: 12px; font-size: 12px; font-family: monospace; color: #555; height: 120px; overflow-y: auto; }
    .log-line { margin-bottom: 4px; }
    .list-area { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
    .list-item {
      padding: 8px 12px; background: #fff; border: 1px solid #e5e5e0;
      border-radius: 6px; font-size: 13px; cursor: pointer;
      transition: background 0.15s; display: flex; align-items: center; justify-content: space-between;
    }
    .list-item:hover { background: #f9f9f7; }
    .list-item.selected { background: #eaf3de; border-color: #639922; }
    .list-item-key { font-weight: 600; color: #1a1a1a; }
    .list-item-val { color: #666; font-size: 12px; }
    .pill { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
    .pill-master { background: #eaf3de; color: #3b6d11; }
    .pill-owner  { background: #e6f1fb; color: #185fa5; }
    .pill-enabled  { background: #eaf3de; color: #3b6d11; }
    .pill-disabled { background: #fcebeb; color: #a32d2d; }
    .ws-status { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #666; }
    .ws-dot { width: 8px; height: 8px; border-radius: 50%; background: #E24B4A; }
    .ws-dot.on { background: #639922; }
    .empty { font-size: 13px; color: #999; padding: 0.5rem 0; text-align: center; }
    .section-label { font-size: 13px; color: #666; margin-bottom: 10px; font-weight: 500; }
    .profile-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 1px solid #ddd; }
  </style>
</head>
<body>
<div class="container">

  <div class="top">
    <h1>🌸 Hoshino Dashboard</h1>
    <div class="ws-status">
      <span class="ws-dot" id="wsDot"></span>
      <span id="wsLabel">WS disconnected</span>
    </div>
  </div>

  <!-- ── System Health ── -->
  <div class="card" id="healthCard">
    <div class="section-label">System Health & Metrics</div>
    <div class="row">
      <div><span class="label">Total Agents:</span> <b id="healthTotal">0</b></div>
      <div><span class="label">Running:</span> <b id="healthRunning">0</b></div>
      <div><span class="label">Uptime:</span> <b id="healthUptime">0s</b></div>
      <div><span class="label">Memory:</span> <b id="healthMemory">-</b></div>
      <button type="button" id="btnHealth" style="margin-left: auto;">↺ Refresh Health</button>
    </div>
  </div>

  <!-- ── Register Agent ── -->
  <div class="card">
    <div class="section-label">Register Agent</div>
    <div class="form-row col3">
      <input type="text" id="inUserId" placeholder="User ID (e.g. agent-1)" />
      <input type="text" id="inPhone" placeholder="Phone (kosongkan untuk QR)" />
      <button type="button" class="primary" id="btnRegister">Register</button>
    </div>
    <div class="actions">
      <button type="button" id="btnList">↺ Refresh list</button>
    </div>
  </div>

  <!-- ── Agent List ── -->
  <div id="agentList"></div>

  <!-- ── Send Message API ── -->
  <div class="card">
    <div class="section-label">Send Message (REST API)</div>
    <div class="form-row col3">
      <input type="text" id="inMsgAgentId" placeholder="Agent User ID" />
      <input type="text" id="inMsgTarget" placeholder="Target Phone / JID (e.g. 628123456789)" />
      <button type="button" class="primary" id="btnSendMessage">Send Message</button>
    </div>
    <div class="form-row" style="margin-bottom: 0;">
      <input type="text" id="inMsgText" placeholder="Pesan teks yang ingin dikirim..." />
    </div>
  </div>

  <!-- ── Presence & Typing Status ── -->
  <div class="card">
    <div class="section-label">Presence & Typing Status</div>
    <div class="form-row col4">
      <input type="text" id="inPresenceAgentId" placeholder="Agent User ID" />
      <input type="text" id="inPresenceTarget" placeholder="Target Phone / JID" />
      <select id="inPresenceStatus">
        <option value="composing">typing (composing)</option>
        <option value="recording">recording audio</option>
        <option value="available">online (available)</option>
        <option value="unavailable">offline (unavailable)</option>
        <option value="paused">paused</option>
      </select>
      <button type="button" class="primary" id="btnSendPresence">Update Presence</button>
    </div>
  </div>

  <!-- ── Profile & Group Inspection ── -->
  <div class="card">
    <div class="section-label">Profile & Group Inspection</div>
    <div class="form-row col3">
      <input type="text" id="inInspectAgentId" placeholder="Agent User ID" />
      <button type="button" id="btnFetchProfile">Fetch Profile</button>
      <button type="button" id="btnFetchGroups">Fetch Joined Groups</button>
    </div>
    <div class="list-area" id="inspectOutput"></div>
  </div>

  <!-- ── Agent Config ── -->
  <div class="card">
    <div class="section-label">Agent Config</div>
    <div class="form-row col3">
      <input type="text" id="inConfigUserId" placeholder="User ID" />
      <input type="text" id="inPrefix" placeholder="Prefix (e.g. /)" />
      <button type="button" id="btnGetConfig">Get</button>
    </div>
    <div class="actions">
      <button type="button" id="btnUpdateConfig">Update Config</button>
    </div>
    <div class="list-area" id="configOutput"></div>
  </div>

  <!-- ── Command Management ── -->
  <div class="card">
    <div class="section-label">Command Management</div>
    <div class="form-row col3">
      <input type="text" id="inCommandUserId" placeholder="User ID" />
      <div></div>
      <button type="button" id="btnGetCommands">Get Commands</button>
    </div>
    <div class="list-area" id="commandList"></div>
  </div>

  <!-- ── Owner Management ── -->
  <div class="card">
    <div class="section-label">Owner Management</div>
    <div class="form-row col4">
      <input type="text" id="inOwnerAgentId" placeholder="Agent User ID" />
      <input type="text" id="inOwnerLid" placeholder="Owner LID / Phone" />
      <select id="inOwnerLevel">
        <option value="owner">Owner</option>
        <option value="master">Master</option>
      </select>
      <button type="button" class="primary" id="btnAddOwner">Add</button>
    </div>
    <div class="actions">
      <button type="button" id="btnListOwners">↺ List Owners</button>
      <button type="button" id="btnChangeLevel">Change Level</button>
      <button type="button" class="danger" id="btnRemoveOwner">Remove Selected</button>
    </div>
    <div class="list-area" id="ownerList"></div>
  </div>

  <!-- ── Group Allowlist ── -->
  <div class="card">
    <div class="section-label">Group Allowlist</div>
    <div class="form-row col4">
      <input type="text" id="inGroupAgentId" placeholder="Agent User ID" />
      <input type="text" id="inGroupJid" placeholder="Group JID (xxx@g.us)" />
      <div></div>
      <button type="button" class="primary" id="btnAllowGroup">Allow</button>
    </div>
    <div class="actions">
      <button type="button" id="btnListGroups">↺ List Groups</button>
      <button type="button" class="danger" id="btnDisallowGroup">Disallow Selected</button>
    </div>
    <div class="list-area" id="groupList"></div>
  </div>

  <!-- ── WS Log ── -->
  <div class="card">
    <div class="section-label">WebSocket Log</div>
    <div class="log" id="wsLog"></div>
  </div>

</div>

<script>
  const API_ORIGIN = window.location.protocol === 'file:'
    ? 'http://localhost:3031'
    : window.location.origin
  const BASE = API_ORIGIN
  const WS_BASE = API_ORIGIN.replace(/^http/, 'ws')
  const agentSockets = {}
  let selectedOwnerLid = null
  let selectedGroupJid = null

  // ── Logger ──
  function log(msg) {
    const el = document.getElementById('wsLog')
    const line = document.createElement('div')
    line.className = 'log-line'
    line.textContent = `${new Date().toLocaleTimeString()}  ${msg}`
    el.appendChild(line)
    el.scrollTop = el.scrollHeight
  }

  // ── Health ──
  async function fetchHealth() {
    const r = await fetch(`${BASE}/agent/health`).then(r => r.json()).catch(() => null)
    if (!r?.success) return
    document.getElementById('healthTotal').textContent   = r.data.totalAgents
    document.getElementById('healthRunning').textContent = r.data.runningAgentsCount
    document.getElementById('healthUptime').textContent  = `${r.data.uptimeSeconds}s`
    document.getElementById('healthMemory').textContent  = `${r.data.memory.heapUsed} / ${r.data.memory.rss}`
  }

  // ── WS Indicator ──
  function setWSIndicator() {
    const on = Object.keys(agentSockets).length > 0
    document.getElementById('wsDot').className = 'ws-dot' + (on ? ' on' : '')
    document.getElementById('wsLabel').textContent = on
      ? `WS connected (${Object.keys(agentSockets).length})`
      : 'WS disconnected'
  }

  // ── WebSocket ──
  function connectWS(userId) {
    if (agentSockets[userId]) { log(`[${userId}] already connected`); return }
    const socket = new WebSocket(`${WS_BASE}/ws/agent/${userId}`)
    agentSockets[userId] = socket

    socket.onopen  = () => { log(`[${userId}] WS connected`); setWSIndicator(); updateWsButton(userId, true) }
    socket.onclose = () => { log(`[${userId}] WS closed`); delete agentSockets[userId]; setWSIndicator(); updateWsButton(userId, false) }
    socket.onerror = () => log(`[${userId}] WS error`)

    socket.onmessage = (e) => {
      const { event, data } = JSON.parse(e.data)
      log(`[${userId}] ← ${event}`)

      if (event === 'qr') {
        const applyQr = async (qrUrl) => {
          if (!qrUrl) return
          let img  = document.getElementById(`qr-img-${userId}`)
          let wrap = document.getElementById(`qr-wrap-${userId}`)
          if (!img || !wrap) {
            await fetchList()
            img  = document.getElementById(`qr-img-${userId}`)
            wrap = document.getElementById(`qr-wrap-${userId}`)
          }
          if (img)  img.src = qrUrl
          if (wrap) wrap.style.display = 'flex'
          const codeWrap = document.getElementById(`code-wrap-${userId}`)
          if (codeWrap) codeWrap.style.display = 'none'
        }

        if (data && data.url) {
          applyQr(data.url)
        } else {
          fetch(`${BASE}/agent/${userId}/qr`).then(r => r.json()).then(r => applyQr(r.data))
        }
      }

      if (event === 'pairing-code') {
        let el   = document.getElementById(`code-${userId}`)
        let wrap = document.getElementById(`code-wrap-${userId}`)
        if (!el || !wrap) {
          fetchList().then(() => {
            el   = document.getElementById(`code-${userId}`)
            wrap = document.getElementById(`code-wrap-${userId}`)
            if (el)   el.textContent = data.code
            if (wrap) wrap.style.display = 'flex'
            const qrWrap = document.getElementById(`qr-wrap-${userId}`)
            if (qrWrap) qrWrap.style.display = 'none'
          })
          return
        }
        if (el)   el.textContent = data.code
        if (wrap) wrap.style.display = 'flex'
        const qrWrap = document.getElementById(`qr-wrap-${userId}`)
        if (qrWrap) qrWrap.style.display = 'none'
      }

      if (event === 'connected') {
        document.getElementById(`qr-wrap-${userId}`)?.style?.setProperty('display', 'none')
        document.getElementById(`code-wrap-${userId}`)?.style?.setProperty('display', 'none')
        fetchList()
      }

      if (event === 'disconnected') fetchList()
    }
  }

  function disconnectWS(userId) {
    agentSockets[userId]?.close()
    delete agentSockets[userId]
    setWSIndicator()
  }

  function updateWsButton(userId, connected) {
    const btn = document.getElementById(`ws-btn-${userId}`)
    if (btn) btn.textContent = connected ? 'Disconnect WS' : 'Connect WS'
  }

  function handleWS(userId) {
    agentSockets[userId] ? disconnectWS(userId) : connectWS(userId)
  }

  // ── Agent List ──
  async function fetchList() {
    fetchHealth()
    const r = await fetch(`${BASE}/agent/list`).then(r => r.json()).catch(() => null)
    const list = document.getElementById('agentList')
    list.innerHTML = ''

    if (!r?.success || r.data.length === 0) {
      list.innerHTML = '<p class="empty">Belum ada agent.</p>'
      return
    }

    r.data.forEach(agent => {
      const badge = agent.running
        ? '<span class="badge badge-active">connected</span>'
        : agent.status === 'loggedOut'
          ? '<span class="badge badge-logout">logged out</span>'
          : '<span class="badge badge-idle">idle</span>'

      const div = document.createElement('div')
      div.className = 'card'
      div.innerHTML = `
        <div class="row">
          <span class="agent-name">${agent.userId}</span>
          ${badge}
        </div>
        <div class="agent-phone">${agent.phoneNumber ?? 'QR mode'} · prefix: <b>${agent.prefix}</b></div>
        <hr/>
        <div id="qr-wrap-${agent.userId}" class="qr-wrap">
          <img id="qr-img-${agent.userId}" src="" alt="QR Code" />
          <span class="label">Scan dengan WhatsApp</span>
        </div>
        <div id="code-wrap-${agent.userId}" class="qr-wrap">
          <span class="label">Masukkan kode pairing di WhatsApp</span>
          <span class="pairing-code" id="code-${agent.userId}">----</span>
        </div>
        <div class="actions">
          <button type="button" id="ws-btn-${agent.userId}" onclick="handleWS('${agent.userId}')">Connect WS</button>
          <button type="button" onclick="handleRestart('${agent.userId}')">Restart</button>
          <button type="button" onclick="handleReregister('${agent.userId}', 'pairing-code', '${agent.phoneNumber ?? ''}')">Reconnect (Pairing Code)</button>
          <button type="button" onclick="handleReregister('${agent.userId}', 'qr')">Reconnect (QR Scan)</button>
          ${agent.status !== 'loggedOut'
            ? `<button type="button" class="danger" onclick="handleLogout('${agent.userId}')">Logout</button>`
            : ''
          }
          <button type="button" class="danger" onclick="handleDelete('${agent.userId}')">Delete</button>
        </div>
      `
      list.appendChild(div)
      if (agentSockets[agent.userId]) updateWsButton(agent.userId, true)
    })
  }

  async function handleRestart(userId) {
    log(`Restarting agent [${userId}]...`)
    const r = await fetch(`${BASE}/agent/${userId}/restart`, { method: 'POST' }).then(r => r.json()).catch(() => null)
    log(`[${userId}] restart: ${r?.message ?? 'error'}`)
    fetchList()
  }

  async function handleLogout(userId) {
    log(`Logging out agent [${userId}]...`)
    disconnectWS(userId)
    const r = await fetch(`${BASE}/agent/${userId}/logout`, { method: 'POST' }).then(r => r.json()).catch(() => null)
    log(`[${userId}] logout: ${r?.message ?? 'error'}`)
    fetchList()
  }

  async function handleDelete(userId) {
    log(`Deleting agent [${userId}]...`)
    disconnectWS(userId)
    const r = await fetch(`${BASE}/agent/${userId}`, { method: 'DELETE' }).then(r => r.json()).catch(() => null)
    log(`[${userId}] delete: ${r?.message ?? 'deleted'}`)
    fetchList()
  }

  async function handleReregister(userId, method, phone) {
    let targetPhone = phone
    if (method === 'qr') {
      targetPhone = null
    } else if (method === 'pairing-code') {
      const defaultVal = (phone && phone !== 'null' && phone !== 'QR mode') ? phone : ''
      targetPhone = prompt(`Masukkan nomor HP untuk agent ${userId} (diperlukan untuk Pairing Code):`, defaultVal)
      if (targetPhone === null || !targetPhone.trim()) {
        alert("Nomor HP wajib diisi untuk menggunakan Pairing Code!")
        return
      }
      targetPhone = targetPhone.trim()
    }

    log(`Reconnecting [${userId}] via ${method}...`)
    const r = await fetch(`${BASE}/agent/reregister`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, method, phoneNumber: targetPhone })
    }).then(r => r.json()).catch(() => null)
    log(`[${userId}] reconnect: ${r?.message ?? 'error'}`)
    if (r?.success) {
      disconnectWS(userId)
      connectWS(userId)
    }
    fetchList()
  }

  // ── Send Message ──
  async function handleSendMessage() {
    const userId = document.getElementById('inMsgAgentId').value.trim()
    const to     = document.getElementById('inMsgTarget').value.trim()
    const text   = document.getElementById('inMsgText').value.trim()

    if (!userId || !to || !text) { log('User ID, Target & Pesan teks wajib diisi'); return }

    log(`Sending message via [${userId}] to ${to}...`)
    const r = await fetch(`${BASE}/agent/${userId}/send-message`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ to, text })
    }).then(r => r.json()).catch(() => null)

    log(`[${userId}] send message: ${r?.message ?? 'error'}`)
    if (r?.success) document.getElementById('inMsgText').value = ''
  }

  // ── Presence ──
  async function handleSendPresence() {
    const userId   = document.getElementById('inPresenceAgentId').value.trim()
    const to       = document.getElementById('inPresenceTarget').value.trim()
    const presence = document.getElementById('inPresenceStatus').value

    if (!userId || !to) { log('User ID & Target wajib diisi'); return }

    log(`Updating presence to ${presence} via [${userId}]...`)
    const r = await fetch(`${BASE}/agent/${userId}/presence`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ to, presence })
    }).then(r => r.json()).catch(() => null)

    log(`[${userId}] presence: ${r?.message ?? 'error'}`)
  }

  // ── Profile & Groups ──
  async function handleFetchProfile() {
    const userId = document.getElementById('inInspectAgentId').value.trim()
    if (!userId) { log('User ID tidak boleh kosong'); return }

    const r = await fetch(`${BASE}/agent/${userId}/profile`).then(r => r.json()).catch(() => null)
    const output = document.getElementById('inspectOutput')

    if (!r?.success) {
      output.innerHTML = `<div class="list-item" style="color:#a32d2d;">${r?.message ?? 'Error'}</div>`
      return
    }

    const p = r.data
    output.innerHTML = `
      <div class="list-item" style="gap:12px;">
        ${p.pictureUrl ? `<img src="${p.pictureUrl}" class="profile-avatar" alt="Avatar" />` : ''}
        <div style="flex:1;">
          <div class="list-item-key">${p.name ?? 'No Name'} (${p.id})</div>
          <div class="list-item-val">LID: ${p.lid ?? '-'}</div>
        </div>
      </div>
    `
    log(`Fetched profile for [${userId}]`)
  }

  async function handleFetchGroups() {
    const userId = document.getElementById('inInspectAgentId').value.trim()
    if (!userId) { log('User ID tidak boleh kosong'); return }

    const r = await fetch(`${BASE}/agent/${userId}/groups/fetch`).then(r => r.json()).catch(() => null)
    const output = document.getElementById('inspectOutput')

    if (!r?.success || !r.data?.length) {
      output.innerHTML = `<div class="empty">${r?.message ?? 'No groups found'}</div>`
      return
    }

    output.innerHTML = r.data.map(g => `
      <div class="list-item">
        <div>
          <div class="list-item-key">${g.subject}</div>
          <div class="list-item-val">${g.id}</div>
        </div>
        <span class="pill pill-owner">${g.participantsCount} members</span>
      </div>
    `).join('')

    log(`Fetched ${r.data.length} groups for [${userId}]`)
  }

  // ── Config ──
  async function handleGetConfig() {
    const userId = document.getElementById('inConfigUserId').value.trim()
    if (!userId) { log('User ID tidak boleh kosong'); return }
    const r = await fetch(`${BASE}/agent/${userId}/config`).then(r => r.json()).catch(() => null)
    const output = document.getElementById('configOutput')
    if (!r?.success) { output.innerHTML = `<div class="list-item" style="color:#a32d2d;">${r?.message ?? 'Error'}</div>`; return }
    output.innerHTML = `<div class="list-item"><span class="list-item-key">Prefix</span><span class="list-item-val">${r.data.prefix}</span></div>`
    document.getElementById('inPrefix').value = r.data.prefix
    log(`Config fetched for [${userId}]`)
  }

  async function handleUpdateConfig() {
    const userId = document.getElementById('inConfigUserId').value.trim()
    const prefix = document.getElementById('inPrefix').value.trim()
    if (!userId || !prefix) { log('User ID & prefix wajib diisi'); return }
    const r = await fetch(`${BASE}/agent/${userId}/config`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prefix })
    }).then(r => r.json()).catch(() => null)
    const output = document.getElementById('configOutput')
    if (!r?.success) { output.innerHTML = `<div class="list-item" style="color:#a32d2d;">${r?.message ?? 'Error'}</div>`; return }
    output.innerHTML = `<div class="list-item" style="background:#eaf3de;"><span class="list-item-key">✓ Updated!</span><span class="list-item-val">prefix: ${r.data.prefix}</span></div>`
    log(`Config updated for [${userId}]`)
    fetchList()
  }

  // ── Commands ──
  async function handleGetCommands() {
    const userId = document.getElementById('inCommandUserId').value.trim()
    if (!userId) { log('User ID tidak boleh kosong'); return }
    const r = await fetch(`${BASE}/agent/${userId}/commands`).then(r => r.json()).catch(() => null)
    const output = document.getElementById('commandList')
    if (!r?.success || !r.data?.length) { output.innerHTML = '<div class="empty">No commands found</div>'; return }
    output.innerHTML = r.data.map(cmd => `
      <div class="list-item">
        <span class="list-item-key">${cmd.name}</span>
        <button type="button" onclick="toggleCommand('${userId}', '${cmd.name}', '${cmd.status === 'enabled' ? 'disabled' : 'enabled'}')"
          class="pill ${cmd.status === 'enabled' ? 'pill-enabled' : 'pill-disabled'}" style="border:none; cursor:pointer;">
          ${cmd.status === 'enabled' ? '✓ Enabled' : '✗ Disabled'}
        </button>
      </div>
    `).join('')
    log(`Loaded ${r.data.length} commands for [${userId}]`)
  }

  async function toggleCommand(userId, commandName, newStatus) {
    const r = await fetch(`${BASE}/agent/${userId}/commands/${commandName}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: newStatus })
    }).then(r => r.json()).catch(() => null)
    if (!r?.success) { log(`Error: ${r?.message ?? 'Failed'}`); return }
    log(`Command ${commandName} → ${newStatus}`)
    handleGetCommands()
  }

  // ── Owner ──
  async function handleListOwners() {
    const userId = document.getElementById('inOwnerAgentId').value.trim()
    if (!userId) { log('Agent User ID tidak boleh kosong'); return }
    const r = await fetch(`${BASE}/agent/${userId}/owner/list`).then(r => r.json()).catch(() => null)
    const output = document.getElementById('ownerList')
    if (!r?.success || !r.data?.length) { output.innerHTML = '<div class="empty">No owners found</div>'; return }
    output.innerHTML = r.data.map(owner => `
      <div class="list-item" onclick="selectOwner('${owner.lid}', this)">
        <span class="list-item-key">${owner.lid}</span>
        <span class="pill ${owner.level === 'master' ? 'pill-master' : 'pill-owner'}">${owner.level}</span>
      </div>
    `).join('')
    log(`Loaded ${r.data.length} owners for [${userId}]`)
  }

  function selectOwner(lid, el) {
    selectedOwnerLid = lid
    document.getElementById('inOwnerLid').value = lid
    document.querySelectorAll('#ownerList .list-item').forEach(e => {
      e.classList.remove('selected')
    })
    el.classList.add('selected')
  }

  async function handleAddOwner() {
    const userId = document.getElementById('inOwnerAgentId').value.trim()
    const lid    = document.getElementById('inOwnerLid').value.trim()
    const level  = document.getElementById('inOwnerLevel').value
    if (!userId || !lid) { log('Agent ID & LID wajib diisi'); return }
    const r = await fetch(`${BASE}/agent/${userId}/owner/add`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lid, level })
    }).then(r => r.json()).catch(() => null)
    if (!r?.success) { log(`Error: ${r?.message ?? 'Failed'}`); return }
    log(`Owner added: ${lid} (${level}) for [${userId}]`)
    handleListOwners()
  }

  async function handleRemoveOwner() {
    const userId = document.getElementById('inOwnerAgentId').value.trim()
    if (!selectedOwnerLid || !userId) { log('Pilih owner dan isi Agent ID dulu'); return }
    if (!confirm(`Remove owner ${selectedOwnerLid}?`)) return
    const r = await fetch(`${BASE}/agent/${userId}/owner/${selectedOwnerLid}`, { method: 'DELETE' }).then(r => r.json()).catch(() => null)
    if (!r?.success) { log(`Error: ${r?.message ?? 'Failed'}`); return }
    log(`Owner removed: ${selectedOwnerLid}`)
    selectedOwnerLid = null
    handleListOwners()
  }

  async function handleChangeLevel() {
    const userId = document.getElementById('inOwnerAgentId').value.trim()
    if (!selectedOwnerLid || !userId) { log('Pilih owner dan isi Agent ID dulu'); return }
    const level = document.getElementById('inOwnerLevel').value
    const r = await fetch(`${BASE}/agent/${userId}/owner/${selectedOwnerLid}/level`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ level })
    }).then(r => r.json()).catch(() => null)
    if (!r?.success) { log(`Error: ${r?.message ?? 'Failed'}`); return }
    log(`Owner ${selectedOwnerLid} → ${level}`)
    handleListOwners()
  }

  // ── Group ──
  async function handleListGroups() {
    const userId = document.getElementById('inGroupAgentId').value.trim()
    if (!userId) { log('Agent User ID tidak boleh kosong'); return }
    const r = await fetch(`${BASE}/agent/${userId}/group/allowlist`).then(r => r.json()).catch(() => null)
    const output = document.getElementById('groupList')
    if (!r?.success || !r.data?.length) { output.innerHTML = '<div class="empty">No groups found</div>'; return }
    output.innerHTML = r.data.map(group => `
      <div class="list-item" onclick="selectGroup('${group.jid}', this)">
        <span class="list-item-key">${group.jid}</span>
        <span class="list-item-val">${new Date(group.allowedAt).toLocaleDateString()}</span>
      </div>
    `).join('')
    log(`Loaded ${r.data.length} groups for [${userId}]`)
  }

  function selectGroup(jid, el) {
    selectedGroupJid = jid
    document.getElementById('inGroupJid').value = jid
    document.querySelectorAll('#groupList .list-item').forEach(e => {
      e.classList.remove('selected')
    })
    el.classList.add('selected')
  }

  async function handleAllowGroup() {
    const userId   = document.getElementById('inGroupAgentId').value.trim()
    const groupJid = document.getElementById('inGroupJid').value.trim()
    if (!userId || !groupJid) { log('Agent ID & Group JID wajib diisi'); return }
    const r = await fetch(`${BASE}/agent/${userId}/group/allow`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ groupJid })
    }).then(r => r.json()).catch(() => null)
    if (!r?.success) { log(`Error: ${r?.message ?? 'Failed'}`); return }
    log(`Group allowed: ${groupJid} for [${userId}]`)
    handleListGroups()
  }

  async function handleDisallowGroup() {
    const userId = document.getElementById('inGroupAgentId').value.trim()
    if (!selectedGroupJid || !userId) { log('Pilih group dan isi Agent ID dulu'); return }
    if (!confirm(`Disallow group ${selectedGroupJid}?`)) return
    const r = await fetch(`${BASE}/agent/${userId}/group/${selectedGroupJid}`, { method: 'DELETE' }).then(r => r.json()).catch(() => null)
    if (!r?.success) { log(`Error: ${r?.message ?? 'Failed'}`); return }
    log(`Group disallowed: ${selectedGroupJid}`)
    selectedGroupJid = null
    handleListGroups()
  }

  // ── Register ──
  document.getElementById('btnRegister').onclick = async () => {
    const userId = document.getElementById('inUserId').value.trim()
    const phone  = document.getElementById('inPhone').value.trim()
    if (!userId) { log('User ID tidak boleh kosong'); return }
    const r = await fetch(`${BASE}/agent/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, phoneNumber: phone || undefined })
    }).then(r => r.json()).catch(() => null)
    log(`register [${userId}]: ${r?.message ?? 'error'}`)
    if (r?.success) {
      connectWS(userId)
      fetchList()
      document.getElementById('inUserId').value = ''
      document.getElementById('inPhone').value  = ''
    } else {
      fetchList()
    }
  }

  // ── Bind buttons ──
  document.getElementById('btnHealth').onclick          = fetchHealth
  document.getElementById('btnSendMessage').onclick     = handleSendMessage
  document.getElementById('btnSendPresence').onclick    = handleSendPresence
  document.getElementById('btnFetchProfile').onclick    = handleFetchProfile
  document.getElementById('btnFetchGroups').onclick     = handleFetchGroups
  document.getElementById('btnList').onclick           = fetchList
  document.getElementById('btnGetConfig').onclick      = handleGetConfig
  document.getElementById('btnUpdateConfig').onclick   = handleUpdateConfig
  document.getElementById('btnGetCommands').onclick    = handleGetCommands
  document.getElementById('btnListOwners').onclick     = handleListOwners
  document.getElementById('btnAddOwner').onclick       = handleAddOwner
  document.getElementById('btnRemoveOwner').onclick    = handleRemoveOwner
  document.getElementById('btnChangeLevel').onclick    = handleChangeLevel
  document.getElementById('btnListGroups').onclick     = handleListGroups
  document.getElementById('btnAllowGroup').onclick     = handleAllowGroup
  document.getElementById('btnDisallowGroup').onclick  = handleDisallowGroup

  fetchList()
</script>
</body>
</html>
